<style>

#sheet.on{animation:fIn .2s}

.row{transition:background .15s}
.row:active{background:var(--line)}
.ma-card{animation:vIn .45s cubic-bezier(.2,.8,.2,1) both}

.ma-card .ma-d{display:none!important}

<script>
/* ===== 単語帳 ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tt=0;function toast(s){const e=$('#toast');e.textContent=s;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{e.hidden=true},2200)}
let sheetItems=[];
function sheet(items){sheetItems=items;$('#sp').innerHTML=items.map((x,i)=>'<button class="row" data-i="'+i+'">'+x[0]+'</button>').join('');$('#sheet').classList.add('on')}
$('#sheet').onclick=e=>{const b=e.target.closest('[data-i]');$('#sheet').classList.remove('on');if(b)sheetItems[+b.dataset.i][1]()};
/* ---- サーバー(Firebase) ---- */
const FBC={apiKey:"AIzaSyASzFYlQVA14xduOR--mXvM2mTFbEiKwTE",authDomain:"pinechat026.firebaseapp.com",projectId:"pinechat026",appId:"1:977942881889:web:f10329d33ba152d45cac20"};
firebase.initializeApp(FBC);const fauth=firebase.auth(),fdbs=firebase.firestore();
const fready=new Promise(res=>fauth.onAuthStateChanged(u=>u?res(u):fauth.signInAnonymously().catch(()=>{const n=$('#net');if(n)n.hidden=false})));
const IDRE=/^PINE-[A-Z0-9_]{6,20}$/;
const A32='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',rnd=n=>Array.from({length:n},()=>A32[Math.random()*32|0]).join('');
/* ---- 端末ごとの内部ID(画面には出ません。公開・いいねの持ち主の区別に使います) ---- */
const ME_KEY='tango_me',OLD_ME='pine_tango_me';
const S={me:{id:'',name:'',reg:1}};
function saveMe(){try{localStorage.setItem(ME_KEY,JSON.stringify({id:S.me.id}))}catch(e){}}
function loadMe(){try{const m=JSON.parse(localStorage.getItem(ME_KEY)||localStorage.getItem(OLD_ME));if(m&&IDRE.test(m.id)){S.me.id=m.id;saveMe();return true}}catch(e){}return false}
/* ---- 共有・通報で使う共通関数 ---- */
function dkClean(n,c,max){max=max||300;n=String(n||'').replace(/\s+/g,' ').trim().slice(0,30);if(!n||!Array.isArray(c))return null;
  const o=[];for(const x of c){if(o.length>=max)break;if(!Array.isArray(x))continue;const q=String(x[0]==null?'':x[0]).trim().slice(0,200),a=String(x[1]==null?'':x[1]).trim().slice(0,200);if(q&&a){const ex=String(x[2]==null?'':x[2]).trim().slice(0,300),ej=String(x[3]==null?'':x[3]).trim().slice(0,300);o.push(ex||ej?[q,a,ex,ej]:[q,a])}}
  return o.length?{n,c:o}:null}
const dkMe=()=>{try{return{a:String(S.me.name||'').slice(0,30),i:String(S.me.id||'').slice(0,40)}}catch(e){return{a:'',i:''}}};
const dkAu=d=>{const me=dkMe();return d&&d.au&&d.au.i&&d.au.i!==me.i?d.au:me};
const dkAuLine=au=>au&&(au.a||au.i)?'作者: '+esc(au.a||'名前なし')+(au.i?' ・ <span class="pid" style="font-size:inherit">'+esc(String(au.i).replace(/^PINE-/,''))+'</span>':''):'';
const RPT_REASONS=['迷惑行為・嫌がらせ','不適切な内容(暴力・性的など)','スパム・詐欺','なりすまし','その他'],RPT_DONE=new Set();
function reportAsk(tg,msg){sheet(RPT_REASONS.map(r=>['🚩 '+r,()=>{
  const d=prompt('詳しい内容があれば入力してください(空のままでもOK)','');if(d===null)return;
  reportSend(tg,msg,r,d.trim().slice(0,300))}]))}
async function reportSend(tg,msg,reason,detail){
  const key=tg.id+'|'+(msg?msg.id:'')+'|'+reason;
  if(RPT_DONE.has(key)){toast('すでに通報済みです');return}
  if(!confirm(tg.name+' さんを通報しますか?\n理由: '+reason+'\n通報は管理者に送信されます。'))return;
  try{await fready;
    const o={by:S.me.id,byName:String(S.me.name||'').slice(0,20),to:String(tg.id).slice(0,40),toName:String(tg.name||'').slice(0,30),reason,detail,room:String(tg.room||'').slice(0,40),status:'open',at:firebase.firestore.FieldValue.serverTimestamp()};
    if(msg){o.mid=String(msg.id||'').slice(0,60);o.text=String(msg.text||'').slice(0,500);if(msg.file)o.file=String(msg.file.name||'').slice(0,80)}
    await fdbs.collection('reports').add(o);RPT_DONE.add(key);toast('通報しました。管理者が確認します')
  }catch(e){toast('通報できませんでした。通信を確認してください')}}

<script>
/* ===== 単語帳 ===== */
(function(){
const KEY='tango_v1',OLDK='pine_tango_v1';
let T;
function ld(){try{T=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLDK))}catch(e){T=null}
  if(!T||typeof T!=='object')T={};if(!Array.isArray(T.decks))T.decks=[];if(!T.lk||typeof T.lk!=='object'||Array.isArray(T.lk))T.lk={}}
const sv=()=>{try{localStorage.setItem(KEY,JSON.stringify(T))}catch(e){}};
ld();


/* ---- 検索(全角/半角・大文字小文字・ひらがな/カタカナを区別しない。スペース区切りでAND検索) ---- */
function nm(s){const raw=Array.from(String(s==null?'':s)),cs=[];
  raw.forEach(c=>{if(cs.length&&/^[\u3099\u309a\uff9e\uff9f]$/.test(c))cs[cs.length-1]+=c;else cs.push(c)}); /* 半角カナの濁点・半濁点は直前の文字と1組にする */
  let n='';const m=[];
  cs.forEach((c,i)=>{let x=c.normalize('NFKC').toLowerCase().replace(/[\u30a1-\u30f6]/g,k=>String.fromCharCode(k.charCodeAt(0)-96));
    if(/^\s+$/.test(x))x=' ';for(let k=0;k<x.length;k++){n+=x[k];m.push(i)}});
  return{cs,n,m}}
const terms=q=>{const t=nm(q).n.split(' ').filter(Boolean);return t.slice(0,8)};
const cardHit=(c,ts)=>{const n=nm(c.q+' '+c.a+' '+(c.ex||'')+' '+(c.ej||'')).n;return ts.every(t=>n.includes(t))};
const nameHit=(d,ts)=>{const n=nm(d.n).n;return ts.every(t=>n.includes(t))};
function hl(s,ts){const o=nm(s);if(!ts.length)return esc(s);const mk=new Array(o.cs.length).fill(0);
  ts.forEach(t=>{let p=0;while((p=o.n.indexOf(t,p))>=0){for(let k=p;k<p+t.length;k++)mk[o.m[k]]=1;p+=t.length}});
  let h='',on=0;o.cs.forEach((c,i)=>{if(mk[i]&&!on){h+='<mark class="tg">';on=1}else if(!mk[i]&&on){h+='</mark>';on=0}h+=esc(c)});
  if(on)h+='</mark>';return h}
const srch=(ph,val,id)=>'<div class="tg-s"><span class="si">🔍</span><input id="'+id+'" type="search" enterkeyhint="search" maxlength="60" placeholder="'+ph+'" autocomplete="off" value="'+esc(val)+'"><button type="button" class="sx" id="'+id+'x" aria-label="検索をクリア"'+(val?'':' hidden')+'>✕</button></div>';

/* ---- 状態 ---- */
let fcDeck=null,fcMode='study',fcQ=[],fcI=0,fcFlip=false,fcStat={ok:0,ng:[]},fcOnly=false,fcShuf=false,fcBusy=false,fcWr=false,fcChk=null;
let gq='',dq='',dfl='all';
const deckOf=()=>T.decks.find(d=>d.id===fcDeck);

/* いいね: publicDecks/{id}/likes/{uid} を作る/消す + 単語帳の lk(いいね数)を ±1 する(1回の batch)。1人1回まで */
async function pubLike(id){const x=PM[id];if(!x)return false;
  if(isMine(x)){toast('自分の単語帳にはいいねできません');return false}
  if(S.me.reg===0){alert('いいねは、アカウント登録後にできます');return false}
  if(LKB[id])return false;LKB[id]=1;let ok=false;
  try{await fready;const u=fauth.currentUser;if(!u)throw 0;
    if(T.lku!==u.uid){T.lk={};T.lku=u.uid}
    const ref=pcol().doc(id),lr=ref.collection('likes').doc(u.uid),on=(await lr.get()).exists,inc=firebase.firestore.FieldValue.increment,b=fdbs.batch();
    if(on){b.delete(lr);b.update(ref,{lk:inc(-1)})}else{b.set(lr,{uid:u.uid,at:firebase.firestore.FieldValue.serverTimestamp()});b.update(ref,{lk:inc(1)})}

  catch(e){toast(e&&e.code==='permission-denied'?'いいねできませんでした(サーバー側の設定が必要です)':e&&e.code==='not-found'?'この単語帳は公開が取り消されたようです':'いいねできませんでした。通信を確認してください')}

/* 公開する / 更新する / 取り消す */
async function pubSend(d){
  if(S.me.reg===0){alert('単語帳の公開は、アカウント登録後にできます');return}
  if(d.src||(d.au&&d.au.i&&d.au.i!==S.me.id)){toast('追加した単語帳は公開できません(自分で作った単語帳だけ公開できます)');return}
  if(!d.cards.length){toast('カードがありません。先にカードを追加しましょう');return}
  const upd=!!d.pub;
  if(!upd&&!confirm('「'+d.n+'」('+d.cards.length+'枚)を公開しますか?\n\n・アプリを使う誰でも、見て自分の単語帳に追加できます\n・いつでも公開を取り消せます'))return;
  const ds=prompt('説明(任意・40字まで。空のままでもOK)',d.pd||'');if(ds===null)return;
  const did=d.id,cards=d.cards.map(cArr),body=JSON.stringify(cards);
  if(new TextEncoder().encode(body).length>PUB_BYTES){toast('単語帳が大きすぎて公開できません(カードを減らしてください)');return}
  toast(upd?'更新しています…':'公開しています…');
  try{await fready;const u=fauth.currentUser;if(!u)throw 0;const TS=firebase.firestore.FieldValue.serverTimestamp();
    let ref=d.pub?pcol().doc(d.pub):null,exists=false;
    if(ref){try{exists=(await ref.get()).exists}catch(e){}}
    if(!exists){const q=await pcol().where('uid','==',u.uid).limit(PUB_MAX+1).get();
      if(q.size>=PUB_MAX){toast('公開できるのは'+PUB_MAX+'冊までです。不要なものの公開を取り消してください');return}
      ref=ref||pcol().doc()}
    const meta={uid:u.uid,by:S.me.id,bn:'',n:d.n.slice(0,30),d:ds.trim().slice(0,40),k:cards.length,
      pv:cards.slice(0,5).map(p=>(p[0]+'  '+p[1]).slice(0,120)),kw:cards.map(p=>p[0]+' '+p[1]).join(' ').slice(0,700),up:TS};
    if(!exists)meta.at=TS;
    const b=fdbs.batch();b.set(ref,meta,{merge:true});b.set(ref.collection('body').doc('c'),{uid:u.uid,c:body});await b.commit();
    const cur=T.decks.find(x=>x.id===did);if(cur){cur.pub=ref.id;cur.pd=ds.trim().slice(0,40);sv()}
    PLOADED=false;toast(upd?'更新しました':'公開しました。「公開された単語帳」に表示されます');if(!pubOn&&fcDeck===did)rFC()}
  catch(e){toast(e&&e.code==='permission-denied'?'公開できませんでした(サーバー側の設定が必要です)':'公開できませんでした。通信を確認してください')}}
async function pubOff(id){

  try{await fready;const ref=pcol().doc(id),b=fdbs.batch();b.delete(ref.collection('body').doc('c'));b.delete(ref);await b.commit();

const dkEnc=o=>{const u=new TextEncoder().encode(JSON.stringify(o));let t='';u.forEach(b=>t+=String.fromCharCode(b));return 'TANGO1:'+btoa(t)};
const dkDec=t=>{try{t=String(t||'').trim();const px=/^(TANGO1|PINEDECK1):/.exec(t);if(!px)return null;const b=atob(t.slice(px[0].length).replace(/\s+/g,''));return JSON.parse(new TextDecoder().decode(Uint8Array.from(b,ch=>ch.charCodeAt(0))))}catch(e){return null}};
function fcCopyCode(d){if(!d.cards.length){toast('カードがありません。先にカードを追加しましょう');return}
  const au=dkAu(d),code=dkEnc({n:d.n,c:d.cards.map(cArr),a:'',i:''}),old=document.getElementById('dk-iss');if(old)old.remove();
  const o=document.createElement('div');o.id='dk-iss';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');
  o.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px';
  o.innerHTML='<div style="background:var(--bg);color:var(--fg);border-radius:16px;padding:18px;width:100%;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,.3)"><div class="ma-t" style="margin-bottom:4px">🔑 共有コードを発行しました</div>'
   +'<div style="color:var(--sub);font-size:13px;margin-bottom:10px">「'+esc(d.n)+'」('+d.cards.length+'枚)<br>このコードを相手に送り、単語帳の「📥 コードで追加」に貼り付けてもらうと取り込めます。</div>'
   +'<textarea id="dk-code" readonly rows="5" style="width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;font-family:monospace;word-break:break-all;background:var(--bar);color:var(--fg)"></textarea>'
   +'<div style="color:var(--sub);font-size:12px;margin:4px 0 12px">'+code.length.toLocaleString()+'文字</div>'
   +'<div style="display:flex;gap:8px"><button class="btn" id="dk-cp" type="button" style="flex:1">📋 コピー</button><button class="btn g" id="dk-cl" type="button" style="flex:1">閉じる</button></div></div>';
  document.body.appendChild(o);const ta=o.querySelector('#dk-code');ta.value=code;ta.focus();ta.select();
  const close=()=>o.remove();o.querySelector('#dk-cl').onclick=close;o.onclick=e=>{if(e.target===o)close()};
  o.querySelector('#dk-cp').onclick=()=>{const done=()=>toast('共有コードをコピーしました'),manual=()=>{ta.focus();ta.select();try{document.execCommand('copy')?done():toast('コードを長押ししてコピーしてください')}catch(e){toast('コードを長押ししてコピーしてください')}};
    try{navigator.clipboard.writeText(code).then(done,manual)}catch(e){manual()}}}
function fcImpCode(){const t=prompt('共有コード(TANGO1:…)を貼り付けてください');if(!t)return;
  const o=dkDec(t),dc=o&&typeof dkClean==='function'?dkClean(o.n,o.c,1000):null;
  if(!dc){toast('共有コードを読み取れませんでした');return}
  const r=window.tangoDecks.add(dc.n,dc.c,'',{a:o.a,i:o.i});if(r.err){toast(r.err);return}
  toast('「'+dc.n+'」を追加しました('+dc.c.length+'枚)');rFC()}
window.tangoDecks={
  list(){return T.decks.map(d=>({id:d.id,n:d.n,k:d.cards.length}))},
  get(id){const d=T.decks.find(x=>x.id===id);return d?{n:d.n,c:d.cards.map(cArr)}:null},
  find(src){const d=src&&T.decks.find(x=>x.src===src);return d?d.id:''},
  add(n,c,src,au){ld();if(src&&T.decks.some(x=>x.src===src))return{err:'すでに追加済みです'};
    if(T.decks.length>=50)return{err:'単語帳は50個までです(不要なものを削除してください)'};
    const t=Date.now().toString(36),id='d'+t+Math.random().toString(36).slice(2,4);
    T.decks.push({id,n:String(n).slice(0,30),src:src||'',au:au&&au.i?{a:String(au.a||'').slice(0,30),i:String(au.i).slice(0,40)}:null,cards:c.slice(0,1000).map((x,i)=>({id:'c'+t+i.toString(36)+Math.random().toString(36).slice(2,5),q:String(x[0]).slice(0,200),a:String(x[1]).slice(0,200),ex:String(x[2]||'').slice(0,300),ej:String(x[3]||'').slice(0,300),k:0}))});
    sv();return{id}},
  open(id){ld();if(!T.decks.some(x=>x.id===id))return;pubOn=false;fcDeck=id;fcMode='study';dq='';dfl='all';fcStart();P.classList.add('on');rFC()},
  exportAll(){ld();return JSON.stringify({app:'tango',v:1,decks:T.decks.map(d=>({id:d.id,n:d.n,src:d.src||'',au:d.au||null,cards:d.cards.map(c=>({id:c.id,q:c.q,a:c.a,ex:c.ex||'',ej:c.ej||'',k:c.k?1:0}))}))})},
  importAll(txt){ld();let o;try{o=JSON.parse(txt)}catch(e){return{err:'ファイルを読み取れませんでした'}}
    const L=o&&Array.isArray(o.decks)?o.decks:Array.isArray(o)?o:null;if(!L)return{err:'単語帳のバックアップではないようです'};
    const ids=new Set(T.decks.map(d=>d.id));let n=0,sk=0;
    L.forEach(d=>{if(!d||typeof d!=='object'||typeof d.id!=='string'||!Array.isArray(d.cards)){sk++;return}
      if(ids.has(d.id)||T.decks.length>=50){sk++;return}ids.add(d.id);
      T.decks.push({id:d.id.slice(0,40),n:String(d.n||'単語帳').slice(0,30),src:String(d.src||'').slice(0,80),au:d.au&&d.au.i?{a:String(d.au.a||'').slice(0,30),i:String(d.au.i).slice(0,40)}:null,
        cards:d.cards.slice(0,1000).filter(c=>c&&String(c.q||'').trim()&&String(c.a||'').trim()).map((c,i)=>({id:String(c.id||('c'+Date.now().toString(36)+i)).slice(0,40),q:String(c.q).slice(0,200),a:String(c.a).slice(0,200),ex:String(c.ex||'').slice(0,300),ej:String(c.ej||'').slice(0,300),k:c.k?1:0}))});n++});
    sv();return{n,sk}}
};
function confetti(host,n){n=n||32;const e=document.createElement('div');e.className='fc-cf';const C=['#3fbfff','#e87aa0','#e8a23a','#9b6bd6','#6cc04a','#e0594f'];
  for(let i=0;i<n;i++){const s=document.createElement('i');s.style.cssText='left:'+Math.random()*100+'%;background:'+C[i%6]+';animation-delay:'+Math.random()*.5+'s;animation-duration:'+(1.4+Math.random()*1.2)+'s;--r:'+(Math.random()*720-360)+'deg;--x:'+(Math.random()*80-40)+'px';e.appendChild(s)}
  host.appendChild(e);setTimeout(()=>e.remove(),3400)}
})();
</script>
<script>

function dlg(html){const old=document.getElementById('tg-dlg');if(old)old.remove();const o=document.createElement('div');o.id='tg-dlg';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');
  o.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px';
  o.innerHTML='<div style="background:var(--bg);color:var(--fg);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:100%;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)">'+html+'</div>';
  document.body.appendChild(o);return o}

  const o=dlg('<div class="ma-t">⚙️ 設定</div>'
   +'<div class="ma-t" style="font-size:14px;margin-top:14px">💾 バックアップ</div><div class="ma-d" style="margin:4px 0 8px;line-height:1.6">単語帳は、この端末のこのブラウザに保存されています。機種変更やブラウザの変更の前に書き出しておくと、あとで読み込めます。</div><div style="display:flex;gap:8px"><button class="btn g" id="tm-ex" type="button" style="flex:1">📤 書き出す</button><button class="btn g" id="tm-im" type="button" style="flex:1">📥 読み込む</button></div><input id="tm-f" type="file" accept="application/json,.json" hidden>'

  g('tm-im').onclick=()=>g('tm-f').click();

    r.onerror=()=>toast('ファイルを読み込めませんでした');r.readAsText(f)}}
window.tgSettings=settings;
if(!loadMe()){S.me.id='PINE-'+rnd(10);saveMe()}

})();
